<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стартовая</title>
<style>
  :root {
    --bg: #000000;
    --surface: #2a0a48;
    --surface-hover: #411070;
    --tile: linear-gradient(155deg, #4a0a4f 0%, #34106a 50%, #10206e 100%);
    --tile-hover: linear-gradient(155deg, #6a0f6f 0%, #4a1698 50%, #1a33a0 100%);
    --text: #f3e8ff;
    --muted: #c3a6e0;
    --accent: #a64dff;
    --pink: #ff1a9e;
    --violet: #a64dff;
    --blue: #2f6bff;
    --bi: linear-gradient(90deg, var(--pink), var(--violet), var(--blue));
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 48px;
  }

  .logo {
    width: 96px;
    height: 96px;
    margin-bottom: 28px;
    filter: drop-shadow(0 0 22px rgba(166, 77, 255, .55)) drop-shadow(0 0 40px rgba(255, 26, 158, .3));
  }
  ::selection { background: var(--pink); color: #fff; }

  .search {
    width: min(720px, 100%);
    display: flex;
    background: linear-gradient(90deg, #5a0a55 0%, #3a1275 50%, #12257f 100%);
    border: none;
    border-radius: 0;
  }
  .search input {
    flex: 1;
    min-width: 0;
    padding: 15px 22px;
    font: inherit;
    font-size: 16px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    caret-color: transparent;
    text-overflow: ellipsis;
    cursor: text;
  }
  .search input::placeholder { color: #d9c2f0; }
  .search { position: relative; }
  .search::after {
    content: "";
    position: absolute;
    inset: 0;
    padding: 3px;
    background: linear-gradient(135deg, var(--pink), var(--violet), var(--blue));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .search:hover::after { opacity: 1; }
  .search:hover { box-shadow: 0 0 22px rgba(166, 77, 255, .35); }

  .sites {
    margin-top: 48px;
    width: min(960px, 100%);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }

  .site {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    padding: 12px 8px;
    background: var(--tile);
    border-radius: 0;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    text-align: center;
    position: relative;
    transition: background .15s, box-shadow .15s;
  }
  .site::after {
    content: "";
    position: absolute;
    inset: 0;
    padding: 3px;
    background: linear-gradient(135deg, var(--pink), var(--violet), var(--blue));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .site:hover {
    background: var(--tile-hover);
    box-shadow: 0 0 22px rgba(166, 77, 255, .35);
  }
  .site:hover::after {
    opacity: 1;
  }

  .icon {
    width: 48px;
    height: 48px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon img { width: 44px; height: 44px; }
  .icon .letter {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
  }

  .site .name {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sites { order: 3; }
  form.search { order: 2; }
  img.logo { order: 1; }
  .top-icons {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    align-items: flex-start;
  }
  .mail-menu { position: relative; }
  .mail-trigger {
    padding: 6px;
    color: var(--pink);
    cursor: pointer;
    display: block;
  }
  .mail-trigger:hover { color: var(--violet); }
  .mail-trigger svg { display: block; }
  .mail-list {
    display: none;
    position: absolute;
    top: 0;
    right: 100%;
    flex-direction: column;
    min-width: 220px;
    background: var(--surface);
    border-top: 3px solid var(--pink);
  }
  .mail-menu:hover .mail-list { display: flex; }
  .mail-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
  }
  .mail-link img { width: 20px; height: 20px; }
  .mail-link .mini-letter {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--pink);
  }
  .mail-link:hover { background: var(--surface-hover); }

  .gear {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 10;
    padding: 6px;
    background: transparent;
    border: none;
    color: var(--pink);
    cursor: pointer;
    line-height: 0;
  }
  .gear:hover { color: var(--violet); }
  .gear svg { display: block; }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0, 0, 0, .6);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal[hidden] { display: none; }
  .panel {
    width: min(640px, 94%);
    max-height: 86vh;
    overflow: auto;
    padding: 20px;
    background: var(--bg);
    border: 1px solid var(--surface-hover);
  }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 16px;
    font-weight: 600;
  }
  .panel h3 {
    margin: 22px 0 12px;
    font-size: 16px;
    font-weight: 600;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--surface);
    font-size: 14px;
  }
  .row input {
    min-width: 0;
    padding: 6px 8px;
    font: inherit;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid transparent;
    outline: none;
  }
  .row input:focus { border-color: var(--accent); }
  .row input.invalid { border-color: var(--pink); }
  .row .rname-in { width: 130px; flex: none; font-weight: 600; }
  .row .rurl-in { flex: 1; color: var(--muted); }
  .row .rurl {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
  }
  .row button,
  .addform button,
  .panel-actions button {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    background: var(--surface-hover);
    color: var(--text);
    border: none;
    cursor: pointer;
  }
  .row button:hover,
  .addform button:hover,
  .panel-actions button:hover { filter: brightness(1.3); }
  .addform {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .addform input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    font: inherit;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid transparent;
    outline: none;
  }
  .addform input:focus { border-color: var(--accent); }
  .panel-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 22px;
  }
  .panel-actions #close { margin-left: auto; }
</style>
</head>

<script>
// ===== Стандартные значения (используются, если в хранилище ещё ничего не сохранено) =====
const DEFAULTS = {
  favorites: [
    { name: "GitHub",    url: "https://github.com" },
    { name: "YouTube",   url: "https://www.youtube.com" },
    { name: "Twitch",    url: "https://www.twitch.tv" },
    { name: "Claude",    url: "https://claude.ai" },
    { name: "Rutracker", url: "https://rutracker.org/" },
    { name: "Twitter",   url: "https://x.com" }
  ],
  mail: [
    { name: "Proton Mail",  url: "https://mail.proton.me" },
    { name: "Gmail",        url: "https://mail.google.com" },
    { name: "Яндекс Почта", url: "https://mail.yandex.ru" }
  ],
  imageSearch: "https://yandex.ru/images"
};

let data = { favorites: [], mail: [], imageSearch: DEFAULTS.imageSearch };
// Черновик настроек: существует, пока открыто окно настроек. В хранилище попадает только по «Сохранить».
let draft = null;

function hostOf(url) {
  try { return new URL(url).hostname; } catch (e) { return ""; }
}

// Иконки подбираются по цепочке, пока не найдётся подходящая (не меньше ICON_MIN_SIZE px):
//   1) https://сайт/favicon.ico  (его кэширует сам браузер)
//   2) Google (64px) для этого адреса
//   3) Google (64px) для основного домена (mail.proton.me -> proton.me)
//   4) буква-заглушка
// Номер сработавшего шага запоминаем для каждого сайта, чтобы не повторять неудачные попытки.
const ICON_STATE_KEY = "newtab-icon-state2";
const ICON_STATE_TTL = 7 * 24 * 60 * 60 * 1000; // через 7 дней пробуем с начала
const ICON_MIN_SIZE = 32;

function getIconState() {
  try { return JSON.parse(localStorage.getItem(ICON_STATE_KEY) || "{}"); } catch (e) { return {}; }
}

// step: номер шага цепочки (число) или "none", если иконки нет нигде
function setIconState(host, step) {
  try {
    const st = getIconState();
    st[host] = { s: step, t: Date.now() };
    localStorage.setItem(ICON_STATE_KEY, JSON.stringify(st));
  } catch (e) {}
}

function clearIconState(host) {
  try {
    const st = getIconState();
    delete st[host];
    localStorage.setItem(ICON_STATE_KEY, JSON.stringify(st));
  } catch (e) {}
}

function freshIconState(host) {
  const v = getIconState()[host];
  return v && Date.now() - v.t < ICON_STATE_TTL ? v.s : null;
}

function googleIconUrl(host) {
  return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
}

// Основной домен: mail.proton.me -> proton.me, news.bbc.co.uk -> bbc.co.uk
function rootDomain(host) {
  const parts = host.split(".");
  if (parts.length <= 2) return host;
  const sld = ["co", "com", "org", "net", "gov", "edu", "ac"];
  const n = parts[parts.length - 1].length === 2 && sld.includes(parts[parts.length - 2]) ? 3 : 2;
  return parts.slice(-n).join(".");
}

function letterEl(name, cls) {
  const el = document.createElement("div");
  el.className = cls;
  el.textContent = (name || "?").trim().charAt(0).toUpperCase() || "?";
  return el;
}

// Возвращает <img> с иконкой сайта или букву-заглушку, если иконки нет нигде
function iconEl(url, name, letterClass) {
  const host = hostOf(url);
  if (!host) return letterEl(name, letterClass);
  const saved = freshIconState(host);
  if (saved === "none") return letterEl(name, letterClass);

  const root = rootDomain(host);
  const steps = [
    { src: "https://" + host + "/favicon.ico", min: ICON_MIN_SIZE },
    { src: googleIconUrl(host), min: root !== host ? ICON_MIN_SIZE : 1 }
  ];
  // Последний шаг принимаем любой иконкой, лишь бы она была
  if (root !== host) steps.push({ src: googleIconUrl(root), min: 1 });

  let i = typeof saved === "number" && saved < steps.length ? saved : 0;

  const img = document.createElement("img");
  img.alt = "";
  img.referrerPolicy = "no-referrer";

  const next = () => {
    i++;
    if (i >= steps.length) {
      setIconState(host, "none");
      img.replaceWith(letterEl(name, letterClass));
      return;
    }
    setIconState(host, i);
    load();
  };
  const load = () => {
    img.onload = () => {
      if (Math.min(img.naturalWidth, img.naturalHeight) < steps[i].min) next();
    };
    img.onerror = next;
    img.src = steps[i].src;
  };
  load();
  return img;
}

// Хранилище: browser.storage.local (если страница работает как расширение) или localStorage (обычная страница file://)
const store = {
  async get() {
    if (typeof browser !== "undefined" && browser.storage && browser.storage.local) {
      return await browser.storage.local.get(["favorites", "mail", "imageSearch"]);
    }
    try { return JSON.parse(localStorage.getItem("newtab-data") || "{}"); } catch (e) { return {}; }
  },
  async set(obj) {
    if (typeof browser !== "undefined" && browser.storage && browser.storage.local) {
      return await browser.storage.local.set(obj);
    }
    try { localStorage.setItem("newtab-data", JSON.stringify(obj)); } catch (e) {}
  }
};

async function load() {
  const stored = await store.get();
  data.favorites = stored.favorites || DEFAULTS.favorites.map(x => ({ ...x }));
  data.mail = stored.mail || DEFAULTS.mail.map(x => ({ ...x }));
  data.imageSearch = stored.imageSearch || DEFAULTS.imageSearch;
}

async function save() {
  await store.set({ favorites: data.favorites, mail: data.mail, imageSearch: data.imageSearch });
}

// ===== Вывод на страницу =====
function renderSites() {
  const box = document.getElementById("sites");
  box.innerHTML = "";
  data.favorites.forEach(site => {
    const a = document.createElement("a");
    a.className = "site";
    a.href = site.url;
    a.title = site.url;

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.appendChild(iconEl(site.url, site.name, "letter"));

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = site.name;

    a.appendChild(icon);
    a.appendChild(name);
    box.appendChild(a);
  });
}

function renderImageSearch() {
  document.getElementById("img-search").href = data.imageSearch;
}

function renderMail() {
  const box = document.getElementById("mail-list");
  box.innerHTML = "";
  data.mail.forEach(m => {
    const a = document.createElement("a");
    a.className = "mail-link";
    a.href = m.url;

    a.appendChild(iconEl(m.url, m.name, "mini-letter"));
    a.appendChild(document.createTextNode(m.name));
    box.appendChild(a);
  });
}

// ===== Панель настроек =====
function renderEditor(listKey, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  draft[listKey].forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "row";

    const name = document.createElement("input");
    name.className = "rname-in";
    name.value = item.name;
    name.placeholder = "Название";

    const url = document.createElement("input");
    url.className = "rurl-in";
    url.value = item.url;
    url.placeholder = "Адрес";

    // Применяем к черновику при потере фокуса или по Enter (в хранилище не пишем)
    const commit = () => {
      const newName = name.value.trim();
      const newUrl = normalizeUrl(url.value);
      if (!newName || !url.value.trim() || !hostOf(newUrl)) {
        // Некорректно: подсвечиваем и возвращаем прежние значения
        name.classList.toggle("invalid", !newName);
        url.classList.toggle("invalid", !url.value.trim() || !hostOf(newUrl));
        setTimeout(() => {
          name.value = item.name; url.value = item.url;
          name.classList.remove("invalid"); url.classList.remove("invalid");
        }, 800);
        return;
      }
      if (newName === item.name && newUrl === item.url) return;
      item.name = newName;
      item.url = newUrl;
      clearIconState(hostOf(newUrl));
      url.value = newUrl;
    };
    name.addEventListener("change", commit);
    url.addEventListener("change", commit);
    [name, url].forEach(inp => inp.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
    }));

    const del = document.createElement("button");
    del.type = "button";
    del.textContent = "Удалить";
    del.addEventListener("click", () => {
      draft[listKey].splice(index, 1);
      renderEditor(listKey, containerId);
    });

    row.appendChild(name);
    row.appendChild(url);
    row.appendChild(del);
    box.appendChild(row);
  });
}

function refreshAll() {
  renderSites();
  renderMail();
  renderImageSearch();
}

function normalizeUrl(raw) {
  let url = raw.trim();
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  return url;
}

function setupForm(formId, listKey, containerId) {
  const form = document.getElementById(formId);
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (!draft) return;
    const name = form.elements.name.value.trim();
    const url = normalizeUrl(form.elements.url.value);
    if (!name || !hostOf(url)) return;
    draft[listKey].push({ name, url });
    form.reset();
    renderEditor(listKey, containerId);
  });
}

function openModal() {
  // Работаем с копией, чтобы «Закрыть» мог отменить все правки
  draft = {
    favorites: data.favorites.map(x => ({ ...x })),
    mail: data.mail.map(x => ({ ...x })),
    imageSearch: data.imageSearch
  };
  document.getElementById("img-url").value = draft.imageSearch;
  renderEditor("favorites", "edit-sites");
  renderEditor("mail", "edit-mail");
  document.getElementById("modal").hidden = false;
}

// Закрыть без сохранения: черновик выбрасывается
function closeModal() {
  draft = null;
  document.getElementById("add-site").reset();
  document.getElementById("add-mail").reset();
  document.getElementById("modal").hidden = true;
}

// Сохранить и закрыть: черновик становится настоящими данными
async function saveAndClose() {
  if (!draft) return;
  data.favorites = draft.favorites;
  data.mail = draft.mail;
  data.imageSearch = draft.imageSearch;
  await save();
  refreshAll();
  closeModal();
}

// ===== Запуск =====
async function init() {
  await load();
  refreshAll();

  document.getElementById("gear").addEventListener("click", openModal);
  document.getElementById("close").addEventListener("click", closeModal);
  document.getElementById("save").addEventListener("click", saveAndClose);
  document.getElementById("modal").addEventListener("click", e => {
    if (e.target.id === "modal") closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });

  // Сброс меняет только черновик; в силу вступит после «Сохранить»
  document.getElementById("reset").addEventListener("click", () => {
    if (!draft) return;
    draft.favorites = DEFAULTS.favorites.map(x => ({ ...x }));
    draft.mail = DEFAULTS.mail.map(x => ({ ...x }));
    draft.imageSearch = DEFAULTS.imageSearch;
    document.getElementById("img-url").value = draft.imageSearch;
    renderEditor("favorites", "edit-sites");
    renderEditor("mail", "edit-mail");
  });

  // Ссылка для значка камеры: попадает в черновик при потере фокуса или по Enter
  const imgUrl = document.getElementById("img-url");
  imgUrl.addEventListener("change", () => {
    if (!draft) return;
    const newUrl = normalizeUrl(imgUrl.value);
    if (!imgUrl.value.trim() || !hostOf(newUrl)) {
      imgUrl.classList.add("invalid");
      setTimeout(() => {
        imgUrl.value = draft ? draft.imageSearch : data.imageSearch;
        imgUrl.classList.remove("invalid");
      }, 800);
      return;
    }
    draft.imageSearch = newUrl;
    imgUrl.value = newUrl;
  });
  imgUrl.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); imgUrl.blur(); }
  });

  // Ввод текста в любом месте страницы попадает в строку поиска
  const searchInput = document.querySelector(".search input");
  document.addEventListener("keydown", e => {
    if (!document.getElementById("modal").hidden) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length !== 1) return;
    const t = document.activeElement;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    searchInput.focus();
  });
  document.addEventListener("click", e => {
    if (!document.getElementById("modal").hidden) return;
    if (e.target.closest("a, button")) return;
    searchInput.focus();
  });
  searchInput.focus();

  setupForm("add-site", "favorites", "edit-sites");
  setupForm("add-mail", "mail", "edit-mail");
}

init();

</script>
